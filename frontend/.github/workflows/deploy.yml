name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      # nginx sirve dist/ por bind mount: no hay que reiniciar nada.
      - name: Pull and build
        run: |
          cd /opt/tienda-ia/ANTOJO-FRONT
          git pull origin main
          npm ci --include=dev
          npm run build
